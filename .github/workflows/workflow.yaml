name: Arcaflow CI Workflow
on:
  push:
    branches:
      - "**"
  release:
    types:
      - published
jobs:
  docsgen:
    uses: arcalot/arcaflow-docsgen/.github/workflows/reusable_workflow.yaml@a3fab7472358b6815ddd56c90ceffae314e7f347 # main
    permissions:
      contents: write
      pull-requests: write
    with:
      plugin_path: "arcaflow_plugin_getting_started_example/getting_started_example_plugin.py"
